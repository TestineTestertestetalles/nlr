<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reisekostentool – Bahn Update</title>
<style>
:root{
  --bg:#151528;
  --card:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.12);
  --gold:#fbbf24;
  --gold2:#f59e0b;
  --green:#34d399;
  --text:#f3f4f6;
  --muted:#9ca3af;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,Segoe UI,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at top left, rgba(251,191,36,0.14), transparent 35%),
    radial-gradient(circle at bottom right, rgba(96,165,250,0.08), transparent 35%);
}
.app{
  position:relative;
  z-index:2;
  max-width:1000px;
  margin:auto;
  padding:48px 20px 80px;
}
.hero{
  text-align:center;
  margin-bottom:42px;
}
.hero-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 18px;
  border-radius:999px;
  background:rgba(251,191,36,0.08);
  border:1px solid rgba(251,191,36,0.2);
  color:var(--gold);
  font-size:12px;
  font-weight:700;
  letter-spacing:.08em;
  margin-bottom:18px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--gold);
}
h1{
  margin:0;
  font-size:54px;
  line-height:1.05;
  letter-spacing:-0.04em;
}
h1 span{
  color:var(--gold);
}
.hero-sub{
  margin-top:16px;
  color:var(--muted);
  font-size:18px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:28px;
  backdrop-filter:blur(12px);
}
.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:24px;
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--muted);
  font-weight:700;
}
.section-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--green);
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:8px;
}
label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--muted);
  font-weight:700;
}
input{
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:10px;
  padding:14px;
  color:white;
  font-size:15px;
}
input:focus{
  outline:none;
  border-color:rgba(251,191,36,0.6);
}
.route-box{
  margin-top:22px;
  padding:18px;
  border-radius:14px;
  background:rgba(52,211,153,0.05);
  border:1px solid rgba(52,211,153,0.18);
}
.route-title{
  font-size:15px;
  font-weight:700;
  margin-bottom:18px;
  color:var(--green);
}
</style>
</head>
<body>
<div class="app">

<div class="hero">
  <div class="hero-badge">
    <div class="dot"></div>
    100% KOSTENLOS · KEINE REGISTRIERUNG
  </div>

  <h1>Reisekosten<span>tool</span></h1>

  <div class="hero-sub">
    Dienstreisen intelligent planen · Bahn · Flug · Auto
  </div>
</div>

<div class="card">
  <div class="section-title">
    <div class="section-dot"></div>
    Bahnverbindung
  </div>

  <div class="route-box">
    <div class="route-title">↗ Hinreise</div>

    <div class="grid">
      <div class="field">
        <label>Ticketkosten (€)</label>
        <input type="number" placeholder="z. B. 49">
      </div>

      <div class="field">
        <label>Abfahrtszeit</label>
        <input type="time">
      </div>

      <div class="field">
        <label>Ankunftszeit</label>
        <input type="time">
      </div>
    </div>
  </div>

  <div class="route-box">
    <div class="route-title">↙ Rückreise</div>

    <div class="grid">
      <div class="field">
        <label>Ticketkosten (€)</label>
        <input type="number" placeholder="z. B. 39">
      </div>

      <div class="field">
        <label>Abfahrtszeit</label>
        <input type="time">
      </div>

      <div class="field">
        <label>Ankunftszeit</label>
        <input type="time">
      </div>
    </div>
  </div>

</div>
</div>
</body>
</html>
